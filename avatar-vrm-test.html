<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>Star-Plaza · Three.js + VRM 人物测试</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171923;color:#f5f6fa}
#view{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;z-index:2;pointer-events:none}
.panel{background:#242938eF;border:1px solid #ffffff20;border-radius:13px;padding:10px 12px;box-shadow:0 5px 24px #0005;backdrop-filter:blur(10px)}
#title{font-weight:700;font-size:14px;line-height:1.3}
#status{font-size:12px;color:#c8d0e0;margin-top:3px;max-width:58vw;overflow-wrap:anywhere}
#actions{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:3;align-items:center;flex-wrap:wrap}
button,.filebtn{border:1px solid #ffffff24;background:#35415b;color:white;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:650;cursor:pointer}
button:active,.filebtn:active{transform:scale(.98)}
.primary{background:#4d79d8;border-color:#6b92e8}
input[type=file]{display:none}
.hint{font-size:11px;color:#b7c0d2;margin-left:auto;max-width:42vw;text-align:right}
#loading{position:fixed;inset:0;display:none;place-items:center;background:#10131bd9;z-index:5}
#loading.show{display:grid}
#loading .panel{max-width:85vw;text-align:center}
#err{color:#ffb5b5;white-space:pre-wrap;font-size:12px;margin-top:8px}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<div id="view"></div>
<div id="top">
  <div class="panel">
    <div id="title">Star-Plaza · Three.js + VRM 测试</div>
    <div id="status">请载入一个 .vrm 人物文件</div>
  </div>
</div>
<div id="actions">
  <label class="filebtn primary" for="file">选择 VRM 人物</label>
  <input id="file" type="file" accept=".vrm,model/gltf-binary">
  <button id="reset">重置视角</button>
  <button id="wire">线框：关</button>
  <div class="hint">单指旋转 · 双指缩放/平移</div>
</div>
<div id="loading"><div class="panel"><strong id="loadtext">正在载入人物…</strong><div id="err"></div></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin } from '@pixiv/three-vrm';

const host = document.getElementById('view');
const statusEl = document.getElementById('status');
const loading = document.getElementById('loading');
const loadText = document.getElementById('loadtext');
const errEl = document.getElementById('err');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x252a3a);
scene.fog = new THREE.Fog(0x252a3a, 9, 24);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 1.05, 3.6);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5efff, 0x55506a, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x9bbcff, 1.0);
fill.position.set(-4, 2, -3); scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.2, 64),
  new THREE.MeshStandardMaterial({color:0x3a4054, roughness:0.92, metalness:0})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.012;
scene.add(floor);
const grid = new THREE.GridHelper(8, 16, 0x7e8aa8, 0x444b60);
grid.position.y = 0.002;
scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 0.85, 0);
controls.minDistance = 0.5;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.88;

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
const clock = new THREE.Clock();
let currentVRM = null;
let wireframe = false;

function setStatus(s){ statusEl.textContent = s; }
function setBusy(on, message='正在载入人物…'){
  loading.classList.toggle('show', on);
  loadText.textContent = message;
  errEl.textContent = '';
}
function disposeCurrent(){
  if(!currentVRM) return;
  scene.remove(currentVRM.scene);
  currentVRM.scene.traverse(o=>{
    if(o.isMesh){
      o.geometry?.dispose();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for(const m of mats) if(m) {
        for(const k in m) if(m[k] && m[k].isTexture) m[k].dispose();
        m.dispose();
      }
    }
  });
  currentVRM = null;
}
function frameModel(vrm){
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  vrm.scene.position.x -= center.x;
  vrm.scene.position.z -= center.z;
  vrm.scene.position.y -= box.min.y;
  const h = Math.max(size.y, 1);
  controls.target.set(0, h*0.52, 0);
  camera.position.set(0, h*0.62, h*2.8);
  camera.near = Math.max(0.01, h/200);
  camera.far = h*30;
  camera.updateProjectionMatrix();
  controls.minDistance = h*0.45;
  controls.maxDistance = h*7;
  controls.update();
}
async function loadFile(file){
  if(!file) return;
  const url = URL.createObjectURL(file);
  setBusy(true, '正在解析 ' + file.name + ' …');
  try{
    const gltf = await loader.loadAsync(url);
    const vrm = gltf.userData.vrm;
    if(!vrm) throw new Error('没有读取到 VRM 数据。请确认选择的是 .vrm 文件，而不是普通图片或压缩包。');
    disposeCurrent();
    currentVRM = vrm;
    scene.add(vrm.scene);
    frameModel(vrm);
    const meta = vrm.meta || {};
    const name = meta.name || file.name;
    setStatus('已载入：' + name + ' · ' + (file.size/1024/1024).toFixed(2) + ' MB · VRM');
    setBusy(false);
  }catch(e){
    console.error(e);
    setBusy(true, '载入失败');
    errEl.textContent = String(e?.message || e);
    setStatus('载入失败，请检查 VRM 文件或网络/CDN。');
  }finally{
    URL.revokeObjectURL(url);
  }
}
document.getElementById('file').addEventListener('change', e=>loadFile(e.target.files?.[0]));
document.getElementById('reset').addEventListener('click', ()=>{
  if(currentVRM) frameModel(currentVRM);
  else { camera.position.set(0,1.05,3.6); controls.target.set(0,.85,0); controls.update(); }
});
document.getElementById('wire').addEventListener('click', e=>{
  wireframe = !wireframe;
  if(currentVRM) currentVRM.scene.traverse(o=>{
    if(o.isMesh){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m=>{ if(m && 'wireframe' in m) m.wireframe = wireframe; });
    }
  });
  e.currentTarget.textContent = '线框：' + (wireframe ? '开' : '关');
});
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(()=>{
  const delta = Math.min(clock.getDelta(), 0.05);
  if(currentVRM) currentVRM.update(delta);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
